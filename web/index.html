<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>maimai 触屏</title>
  <link rel="stylesheet" href="/app/style.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="hud">
      <span id="hud-net">连接中…</span>
      <span id="hud-zone"></span>
    </div>
    <div id="banner" class="banner">连接中…</div>
    <button id="btn-panel" title="设置">⚙</button>
  </div>

  <div id="panel" class="hidden">
    <header>
      <strong>设置 / 校准</strong>
      <button id="btn-close">关闭</button>
    </header>
    <section class="row">
      <label>服务器</label>
      <input id="in-server" type="text" inputmode="url" placeholder="192.168.31.27:8770" />
      <button id="btn-reconnect">重连</button>
    </section>
    <section class="grid">
      <label>中心 X <input id="in-cx" type="range" min="0.2" max="0.8" step="0.005" /></label>
      <label>中心 Y <input id="in-cy" type="range" min="0.2" max="0.8" step="0.005" /></label>
      <label>最内环 <input id="in-r0" type="range" min="0.05" max="0.95" step="0.005" /></label>
      <label>最外环 <input id="in-r4" type="range" min="0.3" max="1.0" step="0.005" /></label>
      <label>扇区偏移° <input id="in-off" type="range" min="-45" max="45" step="0.5" /></label>
    </section>
    <section class="row">
      <label><input id="chk-snap" type="checkbox" /> 吸附到分区中心</label>
      <label><input id="chk-grid" type="checkbox" checked /> 显示分区网格</label>
      <label><input id="chk-labels" type="checkbox" /> 显示分区编号</label>
    </section>
    <section class="row">
      <button id="btn-reset">恢复默认</button>
      <button id="btn-apply">应用到服务器</button>
    </section>
    <section class="hint">
      触摸屏幕上的目标区域即可触发。中心/半径按游戏画面（视频内容区）归一化：
      (0.5,0.5) 为画面中心，半径 1.0 = 画面内切圆边界。5 个环由内到外按比例插值。
    </section>
    <section class="row small">
      <span id="hud-video">视频：—</span>
      <span id="hud-rtt">延迟：—</span>
      <span id="hud-touch">触摸：—</span>
    </section>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
