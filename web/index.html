<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>maimai 触屏</title>
  <link rel="stylesheet" href="/app/style.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="hud">
      <span id="hud-net">连接中…</span>
      <span id="hud-zone"></span>
    </div>
    <div id="banner" class="banner">连接中…</div>
    <button id="btn-panel" title="设置">⚙</button>
  </div>

  <div id="panel" class="hidden">
    <header>
      <strong>设置</strong>
      <button id="btn-close">关闭</button>
    </header>
    <section class="row">
      <label>服务器</label>
      <input id="in-server" type="text" inputmode="url" placeholder="192.168.31.27:8770" />
      <button id="btn-reconnect">重连</button>
    </section>
    <section class="row">
      <label><input id="chk-snap" type="checkbox" /> 吸附到传感器中心</label>
      <label><input id="chk-grid" type="checkbox" /> 显示面板网格</label>
      <label><input id="chk-labels" type="checkbox" /> 显示编号</label>
    </section>
    <section class="sliders">
      <div class="slider-title">
        <span>面板圆微调</span>
        <label><input id="chk-auto" type="checkbox" /> 跟随游戏自动检测</label>
      </div>
      <label class="slider"><span>圆心 X</span><input id="in-cx" type="range" min="0" max="1" step="0.001" /><output id="out-cx"></output></label>
      <label class="slider"><span>圆心 Y</span><input id="in-cy" type="range" min="0" max="1" step="0.001" /><output id="out-cy"></output></label>
      <label class="slider"><span>半径 X</span><input id="in-rx" type="range" min="0.02" max="1" step="0.001" /><output id="out-rx"></output></label>
      <label class="slider"><span>半径 Y</span><input id="in-ry" type="range" min="0.02" max="1" step="0.001" /><output id="out-ry"></output></label>
      <div class="row small">
        <button id="btn-save-panel">保存到 PC</button>
        <button id="btn-reload-panel">读取 PC 的值</button>
      </div>
      <label class="adjust"><input id="chk-adjust" type="checkbox" /> 拖动微调（画面上拖动挪环、双指缩放，此时不发送触摸）</label>
    </section>
    <section class="row">
      <button id="btn-reset">恢复默认几何</button>
    </section>
    <section class="hint">
      触摸面板就是游戏待机画面左下角那个圆：PC 自动检测圆心和半径，触摸按这个圆换算，
      手机上的环会压在游戏里那个圆上。检测不准时用上面的滑杆微调，对齐后「保存到 PC」
      （之后即使游戏画面切换也不会变）。由内到外 <b>C</b> 中心圆 → <b>B1–B8</b> 内环 →
      <b>A1–A8</b> 外环，共 17 个传感器，编号从画面右侧（3 点方向）开始顺时针。
    </section>
    <section class="hint" id="hud-model"></section>
    <section class="row small">
      <span id="hud-video">视频：—</span>
      <span id="hud-rtt">延迟：—</span>
      <span id="hud-touch">触摸：—</span>
    </section>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
