<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>maimai 触屏</title>
  <link rel="stylesheet" href="/app/style.css" />
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="hud">
      <span id="hud-net">连接中…</span>
      <span id="hud-zone"></span>
    </div>
    <div id="banner" class="banner">连接中…</div>
    <button id="btn-panel" title="设置">⚙</button>
  </div>

  <div id="panel" class="hidden">
    <header>
      <strong>设置</strong>
      <button id="btn-close">关闭</button>
    </header>
    <section class="row">
      <label>服务器</label>
      <input id="in-server" type="text" inputmode="url" placeholder="192.168.31.27:8770" />
      <button id="btn-reconnect">重连</button>
    </section>
    <section class="row">
      <label><input id="chk-snap" type="checkbox" /> 吸附到传感器中心</label>
      <label><input id="chk-grid" type="checkbox" /> 显示面板网格</label>
      <label><input id="chk-labels" type="checkbox" /> 显示编号</label>
    </section>
    <section class="row">
      <button id="btn-reset">恢复默认几何</button>
    </section>
    <section class="hint">
      画面外圈就是触摸面板：由内到外 <b>C</b> 中心圆 → <b>B1–B8</b> 内环 → <b>A1–A8</b> 外环，
      共 17 个传感器（与 micetools 的 maitouch 端口一致）。编号从画面右侧（3 点方向）开始、顺时针排列。
      半径边界为 0.2241 / 0.5518 / 1.0（以画面内切圆为 1.0），由游戏端口协议固定，无需校准。
    </section>
    <section class="hint" id="hud-model"></section>
    <section class="row small">
      <span id="hud-video">视频：—</span>
      <span id="hud-rtt">延迟：—</span>
      <span id="hud-touch">触摸：—</span>
    </section>
  </div>

  <script src="/app/app.js"></script>
</body>
</html>
